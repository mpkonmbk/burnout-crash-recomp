# Hand-written CRT byte/word copy routine. Its unaligned-source loop (0x8ABA1A00..0x8ABA1A2C)
# branches back into the tail at 0x8ABA19DC, so the analyzer splits it; pin the full extent.
0x8ABA1988 = { end = 0x8ABA1A30 }

# EASharp-generated switch dispatch. The AOT compiler builds the table address with `li` + `addis`
# (not MSVC's `lis`/`addi`), so ReXGlue's detector misses these and emits an indirect call instead.
# Three shapes, depending on which register still holds the case index at the bctr:
#   - plain: the bounds-checked index register is untouched -> switch on it directly
#   - x4:    only index*4 survives (`rlwinm rI, rI, 2`)    -> each label repeated 4x so case 4*i hits label i
#   - hook:  `lwzx` overwrote the index with the target     -> SwitchIndexFromTarget (src/switch_hooks.cpp)
#            maps the target back to its case number in the dead table-base register before the switch
# Generated by scanning every `lwzx; mtctr; bctr` with a `cmplwi` bounds check.
# bctr 0x8A2AA214: table 0x8A000C34, 5 cases, default 0x8A2AB208, r4 holds index*4 (each label repeated 4x)
